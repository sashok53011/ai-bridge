[project]
name = "ai-bridge"
version = "0.1.0"
description = "AI-приставка: каталог провайдеров, ключи на устройстве, вызовы моделей"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
